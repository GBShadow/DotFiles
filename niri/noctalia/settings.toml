[shell]
lang = "pt-BR"
niri_overview_type_to_launch_enabled = true

    [shell.animation]
    enabled = false

    [shell.screen_corners]
    enabled = true

[theme]
builtin = "Catppuccin"
pure_black_dark = true

[wallpaper]
directory = "/home/gbshadow/Imagens"

    [wallpaper.default]
    path = "/home/gbshadow/Imagens/1282154.jpg"

    [wallpaper.last]
    path = "/home/gbshadow/Imagens/1282154.jpg"

    [[wallpaper.favorite]]
    builtin_palette = "Catppuccin"
    palette_source = "builtin"
    path = "/home/gbshadow/Imagens/1282154.jpg"
    theme_mode = "dark"

[widget.clock]
format = "{:%-d de %B %H:%M}"

[widget.network]
show_label = false
