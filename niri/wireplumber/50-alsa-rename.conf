monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "alsa_output.pci-0000_00_1b.0.pro-output-0"
      }
    ]
    actions = {
      update-props = {
        node.description = "Alto-falantes / Fones (Analógico)"
        audio.position = [ "FL", "FR" ]
      }
    }
  },
  {
    matches = [
      {
        node.name = "alsa_output.pci-0000_00_1b.0.pro-output-3"
      }
    ]
    actions = {
      update-props = {
        node.description = "Monitor Externo (HDMI)"
        audio.position = [ "FL", "FR" ]
      }
    }
  },
  {
    matches = [
      {
        node.name = "alsa_input.pci-0000_00_1b.0.pro-input-0"
      }
    ]
    actions = {
      update-props = {
        node.description = "Microfone Interno"
        audio.position = [ "FL", "FR" ]
      }
    }
  }
]
