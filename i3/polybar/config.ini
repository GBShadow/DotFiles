; format-connected = <label-connected>
; format-connected-prefix = " 󰤨 "
; format-connected-prefix-background = ${colors.peach}
; format-connected-prefix-foreground = ${colors.base}
; label-connected = "%essid% %signal%% "
; label-connected-background = ${colors.peach}
; label-connected-foreground = ${colors.base}

; format-disconnected = <label-disconnected>
; format-disconnected-prefix = " 󰤭 "
; format-disconnected-prefix-background = ${colors.peach}
; format-disconnected-prefix-foreground = ${colors.base}
; label-disconnected = "Offline "
; label-disconnected-background = ${colors.peach}
; label-disconnected-foreground = ${colors.base}
[module/audio-sink]
type = custom/script
exec = if pactl get-default-sink 2>/dev/null | grep -q hdmi; then echo "󰍹 HDMI"; else echo "󰓃 Fone"; fi
interval = 2
format = <label>
format-prefix = " "
format-suffix = " "
format-background = ${colors.sky}
format-foreground = ${colors.base}
click-left = /home/gbshadow/.local/bin/audio-toggle.sh

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
interval = 2

format-volume = <label-volume>
format-volume-prefix = " 󰕾 "
format-volume-prefix-background = ${colors.sapphire}
format-volume-prefix-foreground = ${colors.base}
label-volume = "%percentage%% "
label-volume-background = ${colors.sapphire}
label-volume-foreground = ${colors.base}

format-muted = <label-muted>
format-muted-prefix = " 󰝟 "
format-muted-prefix-background = ${colors.sapphire}
format-muted-prefix-foreground = ${colors.base}
label-muted = "Mudo "
label-muted-background = ${colors.sapphire}
label-muted-foreground = ${colors.base}

click-right = pavucontrol
click-middle = /home/gbshadow/.local/bin/audio-toggle.sh

[module/date]
type = custom/script
exec = date +"%a %d/%m %H:%M"
interval = 5
format = <label>
format-prefix = " 󰃰 "
format-prefix-background = ${colors.lavender}
format-prefix-foreground = ${colors.base}
label = "%output% "
label-background = ${colors.lavender}
label-foreground = ${colors.base}
click-left = gsimplecal

[module/powermenu]
type = custom/text
label = "  "
label-background = ${colors.red}
label-foreground = ${colors.base}
click-left = /home/gbshadow/.local/bin/powermenu.sh

[settings]
screenchange-reload = true
pseudo-transparency = false
