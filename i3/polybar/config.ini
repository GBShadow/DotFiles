;==========================================================
; Polybar Configuration - Catppuccin Mocha Multi-Color Theme
; Tray de ícones no início, seguido pelos blocos de informações
;==========================================================

[colors]
rosewater = #f5e0dc
flamingo  = #f2cdcd
pink      = #f5c2e7
mauve     = #cba6f7
red       = #f38ba8
maroon    = #eba0ac
peach     = #fab387
yellow    = #f9e2af
green     = #a6e3a1
teal      = #94e2d5
sky       = #89dceb
sapphire  = #74c7ec
blue      = #89b4fa
lavender  = #b4befe
text      = #cdd6f4
subtext1  = #bac2de
subtext0  = #a6adc8
overlay2  = #9399b2
overlay1  = #7f849c
overlay0  = #6c7086
surface2  = #585b70
surface1  = #45475a
surface0  = #313244
base      = #1e1e2e
mantle    = #181825
crust     = #11111b
transparent = #00000000

[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 24pt
radius = 0

background = ${colors.base}
foreground = ${colors.text}

line-size = 0pt
border-size = 0pt

padding-left = 0
padding-right = 0
module-margin = 0

separator = ""

font-0 = "JetBrainsMono Nerd Font:style=Bold:size=10;2"
font-1 = "JetBrainsMono Nerd Font:size=11;3"

modules-left = launcher i3
; modules-right original: systray cpu memory disk network audio-sink pulseaudio date powermenu
modules-right = systray cpu memory audio-sink pulseaudio date powermenu

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true
wm-restack = i3

[module/launcher]
type = custom/text
label = " 󰀻 "
label-background = ${colors.mauve}
label-foreground = ${colors.base}
click-left = rofi -show drun -theme slate
click-right = rofi -show run -theme slate

[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
strip-wsnumbers = false
index-sort = true
enable-click = true
enable-scroll = false
wrapping-scroll = false
reverse-scroll = false
fuzzy-matching = true

format = <label-state> <label-mode>

label-mode = %mode%
label-mode-padding = 1
label-mode-background = ${colors.yellow}
label-mode-foreground = ${colors.base}

label-focused = " %name% "
label-focused-background = ${colors.blue}
label-focused-foreground = ${colors.base}
label-focused-padding = 0

label-unfocused = " %name% "
label-unfocused-background = ${colors.surface0}
label-unfocused-foreground = ${colors.overlay1}
label-unfocused-padding = 0

label-visible = " %name% "
label-visible-background = ${colors.surface1}
label-visible-foreground = ${colors.text}
label-visible-padding = 0

label-urgent = " %name% "
label-urgent-background = ${colors.red}
label-urgent-foreground = ${colors.base}
label-urgent-padding = 0

[module/systray]
type = internal/tray
format = <tray>
format-background = ${colors.surface0}
format-padding = 1
tray-spacing = 6px
tray-size = 65%

[module/cpu]
type = internal/cpu
interval = 2
format = <label>
format-prefix = "  "
format-prefix-background = ${colors.green}
format-prefix-foreground = ${colors.base}
label = "%percentage:2%% "
label-background = ${colors.green}
label-foreground = ${colors.base}

[module/memory]
type = internal/memory
interval = 3
format = <label>
format-prefix = " 󰍛 "
format-prefix-background = ${colors.peach}
format-prefix-foreground = ${colors.base}
label = "%gb_used%/%gb_total% "
label-background = ${colors.peach}
label-foreground = ${colors.base}

; [module/disk]
; type = internal/fs
; mount-0 = /
; interval = 30
; fixed-values = true
; format-mounted = <label-mounted>
; format-mounted-prefix = " 󰋊 "
; format-mounted-prefix-background = ${colors.green}
; format-mounted-prefix-foreground = ${colors.base}
; label-mounted = "%used% "
; label-mounted-background = ${colors.green}
; label-mounted-foreground = ${colors.base}

